services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN to your domain}
      TRUST_PROXY: '1'
    volumes:
      - replay_data:/data
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  replay_data:
  caddy_data:
  caddy_config:
