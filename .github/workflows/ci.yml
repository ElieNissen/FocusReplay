name: Verify FocusReplay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- install-electron --no
      - run: npm test
      - run: npm run build
      - run: npm run check:privacy
      - run: npm run test:e2e
      - run: node scripts/test-dev.mjs
