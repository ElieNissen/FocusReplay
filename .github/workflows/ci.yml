name: Verify FocusReplay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- install-electron --no
      - run: npm test
      - run: npm run build
      - run: npm run check:privacy
      - run: npm run test:e2e
      - run: node scripts/test-timeline.mjs
      - run: node scripts/test-dev.mjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - run: npm run build:standalone
      - run: docker build -t focusreplay-test .
      - run: |
          docker run -d --name focusreplay-test -p 127.0.0.1:8787:8787 -e PUBLIC_ORIGIN=http://localhost:8787 focusreplay-test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8787/ > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/p/example/snapshot)" = 401
          docker rm -f focusreplay-test
